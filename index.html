<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <title>Lista de compras</title>
  <link rel="stylesheet" href="style/index.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Sora:wght@100..800&display=swap"
    rel="stylesheet">
</head>

<body>
  <header>
    <div class="logotipo">
      <img src="./assets/logo.svg" alt="logo">
      <h1>quicklist</h1>
    </div>
  </header>
  <div class="container">
    <a href="#" class="voltar">Voltar</a>
    <h2>Compras da semana</h2>
  
  <div class="inputs">
    <form class="formulario">
      <input type="text" placeholder="Adicione um novo item">
      <button>Adicionar item</button>
    </form>
  </div>

  <ul class="lista">
    <li class="item">
      <label class="item-left">
        <input type="checkbox" class="checkbox" />
        <span>Pão de forma</span>
        <button type="button" class="delet" aria-label="Excluir item">
          <img src="./assets/trash.svg" alt="lixeira">
        </button>
    </li>

       <li class="item">
      <label class="item-left">
        <input type="checkbox" class="checkbox" />
        <span>Café preto</span>
        <button type="button" class="delet" aria-label="Excluir item">
          <img src="./assets/trash.svg" alt="lixeira">
        </button>
    </li>


       <li class="item">
      <label class="item-left">
        <input type="checkbox" class="checkbox" />
        <span>Suco de laranja</span>
        <button type="button" class="delet" aria-label="Excluir item">
          <img src="./assets/trash.svg" alt="lixeira">
        </button>
    </li>

       <li class="item">
      <label class="item-left">
        <input type="checkbox" class="checkbox" />
        <span>Bolacha</span>
        <button type="button" class="delet" aria-label="Excluir item">
          <img src="./assets/trash.svg" alt="lixeira">
        </button>
    </li>
  </ul>
  
  <div class="alert">
    <img src="./assets/alert.svg" alt="icon alert">
    <p>
      O item foi removido da lista
    </p>
    <button class="close">
    <img src="./assets/cancel.svg" alt="icon cancel">
    </button>
  </div>
  </div>

</body>

</html>
